services:
  waha:
    image: devlikeapro/waha
    container_name: esafx-waha
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-api-key}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-dev-waha-dashboard}
    expose:
      - "3000"
    volumes:
      - waha_sessions:/app/.sessions

volumes:
  waha_sessions:
